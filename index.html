<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compress Foto - Kompres Foto Online</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 7%;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #6b7280;
            font-size: 16px;
        }

        .upload-box {
            background: white;
            border: 2px dashed #93c5fd;
            border-radius: 18px;
            padding: 55px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .upload-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .upload-box h2 {
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .upload-button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
        }

        #fileInput {
            display: none;
        }

        .editor {
            display: none;
            margin-top: 25px;
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .preview {
            text-align: center;
            margin-bottom: 25px;
        }

        .preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            object-fit: contain;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .info-card {
            background: #f3f4f6;
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            min-width: 150px;
        }

        .info-card span {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .info-card strong {
            font-size: 18px;
        }

        .control {
            margin: 25px 0;
        }

        .control label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            cursor: pointer;
            padding: 13px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
        }

        .compress-btn {
            flex: 1;
            background: #2563eb;
            color: white;
        }

        .compress-btn:hover {
            background: #1d4ed8;
        }

        .reset-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .download-btn {
            display: none;
            width: 100%;
            margin-top: 15px;
            background: #16a34a;
            color: white;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 18px;
            background: #ecfdf5;
            border-radius: 12px;
            text-align: center;
        }

        .result strong {
            color: #15803d;
        }

        footer {
            text-align: center;
            color: #9ca3af;
            padding: 30px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 30px;
            }

            .container {
                margin-top: 30px;
            }

            .upload-box {
                padding: 40px 15px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">📷 Compress Foto</div>
</header>

<main class="container">

    <section class="hero">
        <h1>Kompres Foto Online</h1>
        <p>
            Kurangi ukuran foto dengan mudah tanpa perlu menginstal aplikasi.
        </p>
    </section>

    <div class="upload-box" id="uploadBox">

        <div class="upload-icon">🖼️</div>

        <h2>Pilih Foto</h2>

        <p>
            Klik di sini atau pilih foto dari perangkat kamu
        </p>

        <label for="fileInput" class="upload-button">
            Pilih Foto
        </label>

        <input
            type="file"
            id="fileInput"
            accept="image/jpeg,image/png,image/webp"
        >

    </div>


    <section class="editor" id="editor">

        <div class="preview">
            <img id="previewImage" alt="Preview foto">
        </div>


        <div class="info">

            <div class="info-card">
                <span>Ukuran asli</span>
                <strong id="originalSize">-</strong>
            </div>

            <div class="info-card">
                <span>Ukuran hasil</span>
                <strong id="compressedSize">-</strong>
            </div>

        </div>


        <div class="control">

            <label>
                <span>Kualitas</span>
                <span id="qualityValue">80%</span>
            </label>

            <input
                type="range"
                id="quality"
                min="10"
                max="100"
                value="80"
            >

        </div>


        <div class="buttons">

            <button class="compress-btn" id="compressBtn">
                ⚡ Kompres Foto
            </button>

            <button class="reset-btn" id="resetBtn">
                Reset
            </button>

        </div>


        <button class="download-btn" id="downloadBtn">
            💾 Download Foto
        </button>


        <div class="result" id="result">
            Foto berhasil dikompres!
            <br>
            <strong id="savingText"></strong>
        </div>

    </section>

</main>


<footer>
    Compress Foto © 2026
</footer>


<script>

    const fileInput = document.getElementById("fileInput");
    const uploadBox = document.getElementById("uploadBox");

    const editor = document.getElementById("editor");
    const previewImage = document.getElementById("previewImage");

    const originalSize = document.getElementById("originalSize");
    const compressedSize = document.getElementById("compressedSize");

    const quality = document.getElementById("quality");
    const qualityValue = document.getElementById("qualityValue");

    const compressBtn = document.getElementById("compressBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const resetBtn = document.getElementById("resetBtn");

    const result = document.getElementById("result");
    const savingText = document.getElementById("savingText");

    let selectedFile = null;
    let compressedBlob = null;


    uploadBox.addEventListener("click", function(e) {

        if (e.target.tagName !== "LABEL") {
            fileInput.click();
        }

    });


    fileInput.addEventListener("change", function() {

        const file = this.files[0];

        if (!file) return;

        selectedFile = file;

        originalSize.textContent = formatSize(file.size);

        const reader = new FileReader();

        reader.onload = function(e) {

            previewImage.src = e.target.result;

            editor.style.display = "block";

            compressedSize.textContent = "-";

            downloadBtn.style.display = "none";

            result.style.display = "none";

        };

        reader.readAsDataURL(file);

    });


    quality.addEventListener("input", function() {

        qualityValue.textContent = this.value + "%";

    });


    compressBtn.addEventListener("click", function() {

        if (!selectedFile) return;

        const image = new Image();

        const reader = new FileReader();

        reader.onload = function(e) {

            image.src = e.target.result;

        };

        image.onload = function() {

            const canvas = document.createElement("canvas");

            const ctx = canvas.getContext("2d");

            canvas.width = image.width;
            canvas.height = image.height;

            ctx.drawImage(
                image,
                0,
                0,
                image.width,
                image.height
            );


            const qualityValueNumber =
                parseInt(quality.value) / 100;


            canvas.toBlob(

                function(blob) {

                    compressedBlob = blob;

                    compressedSize.textContent =
                        formatSize(blob.size);


                    const saving =
                        ((selectedFile.size - blob.size)
                        / selectedFile.size) * 100;


                    if (saving > 0) {

                        savingText.textContent =
                            "Ukuran berkurang " +
                            saving.toFixed(1) +
                            "%";

                    } else {

                        savingText.textContent =
                            "Ukuran foto tidak berkurang.";

                    }


                    downloadBtn.style.display = "block";

                    result.style.display = "block";

                },

                "image/jpeg",

                qualityValueNumber

            );

        };

        reader.readAsDataURL(selectedFile);

    });


    downloadBtn.addEventListener("click", function() {

        if (!compressedBlob) return;

        const url = URL.createObjectURL(compressedBlob);

        const link = document.createElement("a");

        link.href = url;

        link.download = "foto-compressed.jpg";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);

    });


    resetBtn.addEventListener("click", function() {

        selectedFile = null;
        compressedBlob = null;

        fileInput.value = "";

        previewImage.src = "";

        editor.style.display = "none";

        downloadBtn.style.display = "none";

        result.style.display = "none";

        compressedSize.textContent = "-";

    });


    function formatSize(bytes) {

        if (bytes === 0) return "0 Bytes";

        const units = [
            "Bytes",
            "KB",
            "MB",
            "GB"
        ];

        const i =
            Math.floor(
                Math.log(bytes) / Math.log(1024)
            );

        return (
            parseFloat(
                (bytes / Math.pow(1024, i))
                .toFixed(2)
            ) +
            " " +
            units[i]
        );

    }

</script>

</body>
</html>
